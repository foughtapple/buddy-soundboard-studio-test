[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "buddy-soundboard-studio-test"
version = "0.1.0"
description = "A polished Windows desktop mini soundboard studio for AI Code Buddy testing."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AI Code Buddy" }]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pyinstaller>=6",
]

[project.scripts]
buddy-soundboard-studio-test = "buddy_soundboard_studio_test.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
